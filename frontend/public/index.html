<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎓 Student Management System</h1>
    <span id="serverInfo" class="badge">checking server…</span>
  </header>

  <main>
    <section class="stats">
      <div class="card"><h3 id="statTotal">0</h3><p>Total Students</p></div>
      <div class="card"><h3 id="statDept">0</h3><p>Departments</p></div>
      <div class="card"><h3 id="statCgpa">–</h3><p>Average CGPA</p></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search by ID, name, department or email…" />
      <button id="addBtn" class="btn primary">+ Add Student</button>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Student ID</th><th>Name</th><th>Department</th><th>Email</th><th>Phone</th><th>Year</th><th>Sem</th><th>CGPA</th><th>Attend. %</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p id="empty" class="empty" hidden>No student records found.</p>
    </div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="modalTitle">Add Student</h2>
      <div id="formError" class="error" hidden></div>
      <div class="grid">
        <label>Student ID*<input id="student_id" /></label>
        <label>Full Name*<input id="name" /></label>
        <label>Department*
          <select id="department">
            <option>CSE</option><option>IT</option><option>ECE</option><option>EEE</option>
            <option>Mechanical</option><option>Civil</option><option>AI &amp; DS</option>
          </select>
        </label>
        <label>Email*<input id="email" type="email" /></label>
        <label>Phone*<input id="phone" /></label>
        <label>Year<select id="year"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <label>Semester<select id="semester"><option value="">–</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label>
        <label>CGPA (0-10)<input id="cgpa" type="number" step="0.01" min="0" max="10" /></label>
        <label>Attendance %<input id="attendance" type="number" step="0.1" min="0" max="100" /></label>
      </div>
      <div class="actions">
        <button id="cancelBtn" class="btn">Cancel</button>
        <button id="saveBtn" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <footer>Cloud Computing Project • Student Management System</footer>
  <script src="app.js"></script>
</body>
</html>
