# Optional: serve on port 80 using Nginx reverse proxy.
# sudo apt install nginx && sudo cp nginx_optional.conf /etc/nginx/sites-available/sms
# sudo ln -s /etc/nginx/sites-available/sms /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
  listen 80;
  server_name _;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
